<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Store</title>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#vegetables">Vegetables</a></li>
        <li><a href="#fruits">Fruits</a></li>
      </ul>
      <input type="text" placeholder="Search products...">
      <button>Search</button>
    </nav>
  </header>
  <main>
    <section id="vegetables">
      <h2>Vegetables</h2>
      <div class="category">
        <div class="product">
          <img src="https://media.geeksforgeeks.org/wp-content/uploads/20240104152640/carrot-icon.png" alt="Carrot">
          <h3>Carrot</h3>
          <p class="price">$1.99/1kg</p>
          <label for="quantity_vegetable1">Quantity:</label>
          <input type="number" id="quantity_vegetable1" value="1">
          <button>Add to Cart</button>
          <button>Buy Now</button>
        </div>
        <!-- More vegetable items... -->
      </div>
    </section>
    <section id="fruits">
      <h2>Fruits</h2>
      <div class="category">
        <div class="product">
          <img src="https://media.geeksforgeeks.org/wp-content/uploads/20240104153254/fresh-apple-icon.png" alt="Apple">
          <h3>Apple</h3>
          <p class="price">$2.49/1kg</p>
          <label for="quantity_fruit1">Quantity:</label>
          <input type="number" id="quantity_fruit1" value="1">
          <button>Add to Cart</button>
          <button>Buy Now</button>
        </div>
        <!-- More fruit items... -->
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Grocery Store. All rights reserved.</p>
  </footer>
</body>
</html>
